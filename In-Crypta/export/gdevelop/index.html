<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IN CRYPTA — Standalone Web Runtime (GDevelop 5.6 JS)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05070e;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(232, 193, 90, 0.2);
      border-radius: 6px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls-hint {
      margin-top: 14px;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.6;
    }
    .key {
      display: inline-block;
      padding: 2px 7px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 4px;
      color: #f3f4f6;
      font-weight: 600;
      font-family: monospace;
      font-size: 11px;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #070a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1f2937;
      border-top-color: #e8c15a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="pixi.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div style="font-size: 16px; font-weight: bold; color: #e8c15a; letter-spacing: 2px;">IN CRYPTA</div>
      <div style="font-size: 12px; color: #9ca3af; margin-top: 4px;">Cargando runtime GDevelop...</div>
    </div>
  </div>

  <div id="controls-hint">
    <span class="key">A</span> / <span class="key">D</span> o <span class="key">◀</span> <span class="key">▶</span> Moverse &nbsp;·&nbsp;
    <span class="key">ESPACIO</span> o <span class="key">W</span> Saltar (corte variable al soltar) &nbsp;·&nbsp;
    <span class="key">SHIFT</span> o <span class="key">X</span> Dash &nbsp;·&nbsp;
    <span class="key">Z</span> / <span class="key">J</span> / <span class="key">C</span> o <span class="key">CLICK</span> Atacar (Pala / Guadaña) &nbsp;·&nbsp;
    <span class="key">F2</span> Estilo Gótico &nbsp;·&nbsp;
    <span class="key">P</span> Pausa &nbsp;·&nbsp;
    <span class="key">R</span> Reiniciar &nbsp;·&nbsp;
    <span class="key">M</span> Silencio &nbsp;·&nbsp;
    <span class="key">ENTER</span> Continuar
  </div>

  <script>
    (async function init() {
      const container = document.getElementById("game-container");
      const overlay = document.getElementById("loading-overlay");

      // Inicializar PIXI Application
      const app = new PIXI.Application({
        width: 960,
        height: 540,
        backgroundColor: 0x070a12,
        antialias: false,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
      });
      container.appendChild(app.view);

      // Capa raíz que replica la jerarquía de GDevelop
      const stageContainer = new PIXI.Container();
      app.stage.addChild(stageContainer);

      const layer = {
        getRenderer: () => ({ getPIXIContainer: () => stageContainer }),
        getRendererObject: () => stageContainer,
        setCameraX: (x) => {
          stageContainer.position.x = -x + 960 / 2;
        },
        setCameraY: (y) => {
          stageContainer.position.y = -y + 540 / 2;
        }
      };

      // Gestor de teclas
      const teclas = {};
      const mapeo = {
        "ArrowLeft": "Left",
        "ArrowRight": "Right",
        "ArrowUp": "Up",
        "ArrowDown": "Down",
        "Space": "Space",
        " ": "Space",
        "ShiftLeft": "Shift",
        "ShiftRight": "Shift",
        "Enter": "Enter",
        "KeyZ": "KeyZ",
        "KeyJ": "KeyJ",
        "KeyC": "KeyC",
        "KeyA": "KeyA",
        "KeyD": "KeyD",
        "KeyW": "KeyW",
        "KeyX": "KeyX",
        "KeyP": "KeyP",
        "KeyR": "KeyR",
        "KeyM": "KeyM",
        "Escape": "Escape",
        "F2": "F2"
      };

      window.addEventListener("keydown", (e) => {
        teclas[e.key] = true;
        teclas[e.code] = true;
        teclas[e.key.toLowerCase()] = true;
        if (mapeo[e.code]) teclas[mapeo[e.code]] = true;
        if (e.key === "F2" || e.code === "F2") {
          e.preventDefault();
          teclas["F2"] = true;
          window.__incrypta_f2_pressed = true;
        }
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
          e.preventDefault();
        }
      });

      window.addEventListener("keyup", (e) => {
        teclas[e.key] = false;
        teclas[e.code] = false;
        teclas[e.key.toLowerCase()] = false;
        if (mapeo[e.code]) teclas[mapeo[e.code]] = false;
        if (e.key === "F2" || e.code === "F2") {
          teclas["F2"] = false;
          window.__incrypta_f2_pressed = false;
        }
      });

      window.addEventListener("mousedown", (e) => {
        if (e.button === 0) {
          teclas["MouseLeft"] = true;
        }
      });

      window.addEventListener("mouseup", (e) => {
        if (e.button === 0) {
          teclas["MouseLeft"] = false;
        }
      });

      // Cargar game_data.json
      let gameData = null;
      try {
        const resp = await fetch("game_data.json");
        gameData = await resp.json();
      } catch (err) {
        console.error("Error al cargar game_data.json:", err);
        overlay.innerHTML = "<div style='color:#d2414b;padding:20px;text-align:center;'><b>Error al cargar game_data.json</b><br>Ejecutá un servidor local: <code>python -m http.server 8000</code></div>";
        return;
      }

      // Contexto GDevelop simulado
      window.gdjs = {
        evtTools: {
          input: {
            isKeyPressed: (_scene, nombre) => Boolean(teclas[nombre])
          }
        }
      };

      window.runtimeScene = {
        getLayer: (_name) => layer,
        getGame: () => ({
          getJsonManager: () => ({
            loadJson: (nombre, callback) => {
              if (nombre === "game_data") {
                callback(null, gameData);
              } else {
                callback("Recurso no encontrado: " + nombre, null);
              }
            }
          })
        })
      };

      // Cargar runtime_gdevelop.js
      let codigoRuntime = "";
      try {
        const resp = await fetch("runtime_gdevelop.js?v=" + Date.now());
        codigoRuntime = await resp.text();
      } catch (err) {
        console.error("Error al cargar runtime_gdevelop.js:", err);
        return;
      }

      const ejecutarTick = new Function(codigoRuntime);

      // Primer frame para inicializar estado
      ejecutarTick();

      overlay.style.opacity = "0";
      setTimeout(() => overlay.remove(), 350);

      // Bucle de juego a 60 FPS
      app.ticker.add(() => {
        ejecutarTick();
      });
    })();
  </script>
</body>
</html>
